name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Validate vendored spec
        run: uv run .kit/validate.py .spec

  linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - name: Build and unit tests
        run: swift test
      - name: Conformance
        run: swift run pmtiles-conformance
      - name: Canonical examples
        run: |
          swift run inspect_archive
          swift run fetch_one_tile
          swift run remote_metadata
      - name: Short fuzz run
        run: FUZZ_SECONDS=30 swift run -c release pmtiles-fuzz

  macos:
    # Public repo: GitHub-hosted runners only, never self-hosted (anyone can open a PR).
    # Skipped while the repo is private, where hosted macOS bills at 10x; merge this
    # right before making the repo public.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and unit tests
        run: swift test
      - name: Conformance
        run: swift run pmtiles-conformance
      - name: Canonical examples
        run: |
          swift run inspect_archive
          swift run fetch_one_tile
          swift run remote_metadata
      - name: Benchmark builds and matches the checksum (timings not recorded from CI)
        run: |
          if [ -d .spec/bench ]; then swift run -c release pmtiles-bench; else echo "spec bench input not vendored yet"; fi
